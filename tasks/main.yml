---
#- include_tasks: repo.yml
# TODO extend to EL
- include_tasks: release.yml
  when: ansible_facts['os_family'] == 'Debian'
# Installing Ansible doesn't belong here
#- include_tasks: ansible.yml
- include_tasks: update_ubuntu.yml
  when: ansible_facts['os_family'] == 'Debian'
- include_tasks: update_el8.yml
  when: ansible_facts['os_family'] == 'RedHat'
# TODO fix for ARM64
- include_tasks: hwe.yml
  when: (ansible_facts['virtualization_type'] != 'docker') and (ansible_facts['os_family'] == 'Debian') and (ansible_facts['architecture'] != 'aarch64')
